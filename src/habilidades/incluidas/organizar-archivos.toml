[habilidad]
nombre = "organizar-archivos"
descripcion = "Ordena los archivos de una carpeta por tipo (imágenes, documentos, código…)"
version = "1.0.0"
autor = "OpenJarvis (adaptado)"
disparadores = ["organiza la carpeta", "ordena la carpeta", "organiza mis archivos", "range le dossier"]

[[habilidad.pasos]]
herramienta = "manos"
plantilla = "En la carpeta indicada, crea subcarpetas imagenes, documentos, codigo, comprimidos, multimedia y otros, y mueve cada archivo a la suya según su tipo. No borres nada. Al terminar, devuelve un informe breve de lo movido. Petición: {entrada}"
salida = "informe"
